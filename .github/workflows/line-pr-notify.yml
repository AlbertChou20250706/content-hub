name: LINE PR Notify

on:
  pull_request:
    types: [opened, closed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send LINE broadcast
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$PR_ACTION" = "opened" ]; then
            printf -v TEXT '📬 [PR 建立] #%s %s\n作者：%s\n待審核：%s' "$PR_NUMBER" "$PR_TITLE" "$PR_AUTHOR" "$PR_URL"
          elif [ "$PR_MERGED" = "true" ]; then
            printf -v TEXT '🎉 [Daily Tool Digest] PR 已成功合併至 main\n#%s %s\n%s' "$PR_NUMBER" "$PR_TITLE" "$PR_URL"
          else
            printf -v TEXT '⚠️ PR 已關閉（未合併，順延至下週）\n#%s %s\n%s' "$PR_NUMBER" "$PR_TITLE" "$PR_URL"
          fi

          PAYLOAD=$(jq -n --arg text "$TEXT" '{messages: [{type: "text", text: $text}]}')

          curl -sS -f -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
